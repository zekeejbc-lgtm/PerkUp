<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    body { margin: 0; padding: 0; background-color: #f5f7f8; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }

    .email-wrapper { width: 100%; background-color: #f5f7f8; padding: 30px 0; }
    .email-container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

    .header { padding: 30px 20px; text-align: center; border-bottom: 3px solid #DE922A; }
    .header img { max-width: 120px; height: auto; }

    .content { padding: 40px 30px; color: #333333; line-height: 1.6; font-size: 16px; }
    .content h2 { color: #1F4F5B; margin-top: 0; font-weight: 600; }
    .otp-code { margin: 24px auto 8px auto; padding: 16px 20px; max-width: 260px; text-align: center; color: #1F4F5B; background-color: #f5f7f8; border: 1px solid #dbe4e7; border-radius: 6px; font-size: 30px; font-weight: 700; letter-spacing: 6px; }
    .store-card { margin: 24px 0; padding: 22px; background-color: #f5f7f8; border: 1px solid #dbe4e7; border-radius: 8px; }
    .store-logo { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 3px solid #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .store-name { margin: 10px 0 16px; color: #1F4F5B; font-size: 20px; font-weight: 700; }
    .store-detail { padding: 7px 0; border-top: 1px solid #dbe4e7; font-size: 14px; }
    .store-label { color: #698f98; font-weight: 600; }
    .action-button { display: inline-block; padding: 12px 28px; background-color: #DE922A; color: #ffffff; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }

    .footer { background-color: #1F4F5B; color: #ffffff; padding: 30px 30px 20px 30px; text-align: center; font-size: 14px; }
    .footer-system-name { font-size: 18px; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; }
    .footer-links { margin-bottom: 20px; }
    .footer-links a { color: #DE922A; text-decoration: none; margin: 0 10px; font-weight: 600; }
    .disclaimer { font-size: 12px; color: #a1b8bd; line-height: 1.5; margin-bottom: 15px; border-top: 1px solid #2a6372; padding-top: 15px; }
    .ref-id { font-size: 10px; color: #698f98; }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">
      <div class="header">
        <img src="<?= logoUrl ?>" alt="<?= systemName ?> Logo">
      </div>

      <div class="content">
        <h2><?= heading ?></h2>
        <p><?= introText ?></p>

        <? if (otpCode) { ?>
          <div class="otp-code"><?= otpCode ?></div>
        <? } ?>

        <? if (store) { ?>
          <div class="store-card">
            <div style="text-align: center;">
              <? if (store.logoUrl) { ?>
                <img src="<?= store.logoUrl ?>" alt="<?= store.name ?> logo" class="store-logo">
              <? } ?>
              <div class="store-name"><?= store.name ?></div>
            </div>
            <? if (store.location) { ?>
              <div class="store-detail"><span class="store-label">Location:</span> <?= store.location ?></div>
            <? } ?>
            <? if (store.subscriptionLevel) { ?>
              <div class="store-detail"><span class="store-label">Subscription:</span> <?= store.subscriptionLevel ?></div>
            <? } ?>
            <? if (store.paymentSchedule) { ?>
              <div class="store-detail"><span class="store-label">Payment schedule:</span> <?= store.paymentSchedule ?></div>
            <? } ?>
            <? if (store.subscriptionStart) { ?>
              <div class="store-detail"><span class="store-label">Subscription start:</span> <?= store.subscriptionStart ?></div>
            <? } ?>
            <? if (store.subscriptionEnd) { ?>
              <div class="store-detail"><span class="store-label">Subscription end:</span> <?= store.subscriptionEnd ?></div>
            <? } ?>
          </div>
        <? } ?>

        <p><?= secondaryText ?></p>

        <? if (showButton) { ?>
          <div style="text-align: center;">
            <a href="<?= buttonLink ?>" class="action-button"><?= buttonText ?></a>
          </div>
        <? } ?>
      </div>

      <div class="footer">
        <div class="footer-system-name"><?= systemName ?></div>

        <div class="footer-links">
          <a href="<?= websiteLink ?>">Website</a> |
          <a href="<?= facebookLink ?>">Facebook</a>
        </div>

        <div class="disclaimer">
          This is an automated message generated by our system.<br>
          If you did not request this email or believe you received it by mistake, please safely ignore it.
        </div>

        <div class="ref-id">
          Ref ID: <?= referenceId ?>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

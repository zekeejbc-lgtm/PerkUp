<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ea580c" />
    <title>PerkUp Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #fafafa;
        color: #111827;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 440px;
      }

      img {
        height: 56px;
        width: 56px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.15;
        margin: 24px 0 12px;
      }

      p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 24px;
      }

      button {
        background: #ea580c;
        border: 0;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #030712;
          color: #f9fafb;
        }

        p {
          color: #d1d5db;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="PerkUp" />
      <h1>You are offline</h1>
      <p>PerkUp can open previously loaded screens while offline. Reconnect to sync account data and loyalty scans.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>

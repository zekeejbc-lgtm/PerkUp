<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1b1b" />
    <title>Perk Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "JA Jayagiri Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #ffffff;
        color: #1b1b1b;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 440px;
      }

      img {
        height: auto;
        width: 150px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.15;
        margin: 24px 0 12px;
      }

      p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 24px;
      }

      button {
        background: #1b1b1b;
        border: 0;
        border-radius: 12px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1b1b1b;
          color: #ffffff;
        }

        p {
          color: #d1d5db;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <picture>
        <source srcset="/icons/perk-wordmark-dark-transparent.png?v=20260625-brand" media="(prefers-color-scheme: dark)" />
        <img src="/icons/perk-wordmark-light-transparent.png?v=20260625-brand" alt="perk." />
      </picture>
      <h1>You are offline</h1>
      <p>Perk can open supported saved screens while offline. Reconnect before crediting loyalty points, redeeming rewards, or changing account data.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
